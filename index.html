<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>3D示例 - T-PageCode</title>
    <style>
        *{
            margin: 0;
            user-select: none;
        }
        div{
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%,-50%);
            width: 350px;
            height: 650px;
            background-color: blueviolet;
            border-radius: 30px;
            color: white;
            font-size: 55px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.5s ease;
        }
        div:hover{
            transform: translate(-50%,-50%) perspective(800px) rotateX(-50deg);
        }
        div:active{
            transform: translate(-50%,-50%) perspective(800px) rotateX(-180deg) rotateY(-50deg);
        }
    </style>
</head>
<body>
    <div>示范卡片</div>
    <script>
        document.addEventListener("contextmenu",(e) => {
            e.preventDefault();
        })
    </script>
</body>
</html>
